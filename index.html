<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>Дискотека 80-х</title>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <!-- Inter as fallback for SF Pro on non-Apple devices -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --text-2: #6e6e73;
            --text-3: #86868b;
            --field: #ffffff;
            --field-border: #d2d2d7;
            --separator: #e5e5ea;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --focus-ring: rgba(0, 113, 227, 0.25);
            --segment-bg: #e8e8ed;
            --segment-active: #ffffff;
            --green: #248a3d;
            --green-bg: #e3f6e8;
            --orange: #b25000;
            --orange-bg: #fff2df;
            --red: #d70015;
            --red-bg: #ffe5e7;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1c1c1e;
                --text: #f5f5f7;
                --text-2: #a1a1a6;
                --text-3: #8e8e93;
                --field: #2c2c2e;
                --field-border: #3a3a3c;
                --separator: #38383a;
                --accent: #0a84ff;
                --accent-hover: #409cff;
                --focus-ring: rgba(10, 132, 255, 0.35);
                --segment-bg: #2c2c2e;
                --segment-active: #636366;
                --green: #30d158;
                --green-bg: rgba(48, 209, 88, 0.15);
                --orange: #ff9f0a;
                --orange-bg: rgba(255, 159, 10, 0.15);
                --red: #ff453a;
                --red-bg: rgba(255, 69, 58, 0.15);
                --shadow: none;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        .hidden { display: none !important; }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 24px;
        }

        /* HEADER */
        .hero-img {
            width: 100%;
            max-height: 190px;
            object-fit: cover;
            border-radius: 14px;
            display: block;
        }
        .eyebrow {
            margin: 18px 0 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            text-align: center;
        }
        .title {
            margin: 0;
            font-size: 28px;
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: -0.025em;
            text-align: center;
        }
        .subtitle {
            margin: 6px 0 22px;
            font-size: 15px;
            color: var(--text-2);
            text-align: center;
        }

        /* FORM */
        .field { margin-bottom: 12px; }
        .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
        .label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            margin: 0 0 6px 4px;
        }
        .input {
            min-width: 0;
            width: 100%;
            height: 46px;
            padding: 0 14px;
            font: inherit;
            font-size: 16px;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--field-border);
            border-radius: 12px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            -webkit-appearance: none;
            appearance: none;
        }
        .input::placeholder { color: var(--text-3); }
        .input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }
        .select-wrap { position: relative; }
        .select-wrap .input { padding-right: 34px; cursor: pointer; }
        .select-wrap i {
            position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 11px; color: var(--text-3);
            pointer-events: none;
        }

        .captcha { display: flex; justify-content: center; margin: 16px 0 4px; }

        .btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 980px;
            font: inherit;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, transform .1s, opacity .15s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: .6; cursor: default; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-link {
            background: none; border: none; font: inherit;
            font-size: 15px; color: var(--accent);
            cursor: pointer; padding: 10px; width: 100%;
        }
        .btn-link:hover { text-decoration: underline; }
        .btn-pill {
            display: inline-flex; align-items: center; gap: 8px;
            height: 44px; padding: 0 22px;
            border: none; border-radius: 980px;
            font: inherit; font-size: 15px; font-weight: 600;
            cursor: pointer;
        }
        .btn-pill.primary { background: var(--accent); color: #fff; }
        .btn-pill.danger { background: var(--red-bg); color: var(--red); }

        .alert {
            margin: 10px 0 0;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            background: var(--red-bg);
            color: var(--red);
        }

        /* TICKET */
        .badge-ok {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 980px;
            background: var(--green-bg); color: var(--green);
            font-size: 14px; font-weight: 600;
        }
        .ticket-name { margin: 14px 0 2px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
        .ticket-grade { margin: 0; font-size: 15px; color: var(--text-2); }
        .qr-box {
            margin: 22px auto 10px;
            width: fit-content;
            padding: 14px;
            background: #fff;
            border-radius: 18px;
            border: 1px solid var(--separator);
        }
        .ticket-id { font-size: 12px; color: var(--text-3); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
        .note {
            margin-top: 18px;
            padding: 12px;
            border-radius: 12px;
            background: var(--orange-bg);
            color: var(--orange);
            font-size: 14px;
            font-weight: 500;
        }

        /* ADMIN */
        .admin-head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px;
        }
        .admin-head h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
        .segmented {
            display: flex; padding: 2px; margin-bottom: 18px;
            background: var(--segment-bg); border-radius: 10px;
        }
        .segmented button {
            flex: 1; height: 32px; border: none; border-radius: 8px;
            background: transparent; color: var(--text);
            font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
            transition: background .15s, box-shadow .15s;
        }
        .segmented button.active {
            background: var(--segment-active);
            font-weight: 600;
            box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04);
        }

        #reader {
            width: 100%;
            min-height: 250px;
            border-radius: 16px;
            overflow: hidden !important;
            background: #000;
            position: relative;
        }
        #reader video { object-fit: cover; width: 100% !important; height: 100% !important; }

        .scan-result {
            margin-top: 14px; padding: 16px; border-radius: 14px; text-align: center;
        }
        .scan-result .icon { font-size: 26px; margin-bottom: 6px; }
        .scan-result .name { font-size: 18px; font-weight: 700; }
        .scan-result .sub { font-size: 13px; font-weight: 500; margin-top: 2px; }
        .scan-ok { background: var(--green-bg); color: var(--green); }
        .scan-warn { background: var(--orange-bg); color: var(--orange); }
        .scan-bad { background: var(--red-bg); color: var(--red); }
        .scan-ok .name, .scan-warn .name { color: var(--text); }

        #admin-list-content { max-height: 420px; overflow-y: auto; }
        .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
        .stat {
            background: var(--bg); border-radius: 12px; padding: 8px 4px; text-align: center;
        }
        .stat .k { font-size: 11px; color: var(--text-2); font-weight: 500; }
        .stat .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
        .totals {
            display: flex; justify-content: space-between;
            font-size: 13px; color: var(--text-2);
            padding: 0 4px 10px; border-bottom: 1px solid var(--separator);
        }
        .totals b { color: var(--text); }
        .totals b.green { color: var(--green); }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px 4px; border-bottom: 1px solid var(--separator); vertical-align: middle; }
        .t-name { font-size: 15px; font-weight: 500; }
        .t-phone { font-size: 12px; color: var(--text-3); margin-top: 2px; }
        .t-grade { font-size: 13px; color: var(--text-2); text-align: center; white-space: nowrap; }
        .pill {
            display: inline-block; padding: 3px 10px; border-radius: 980px;
            font-size: 12px; font-weight: 600;
        }
        .pill.in { background: var(--green-bg); color: var(--green); }
        .pill.out { background: var(--segment-bg); color: var(--text-2); }

        .loader {
            width: 22px; height: 22px; margin: 0 auto;
            border: 2.5px solid rgba(255,255,255,.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        .scan-result .loader, .loader.dark { border-color: var(--separator); border-top-color: var(--accent); }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* GLOBAL ERROR */
        #globalError {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            max-width: calc(100% - 32px);
            padding: 12px 18px; border-radius: 14px;
            background: var(--red); color: #fff;
            font-size: 14px; font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,.2);
            z-index: 50;
        }

        /* ADMIN TRIGGER */
        .admin-trigger {
            position: fixed; right: 16px; bottom: 16px;
            width: 40px; height: 40px; border-radius: 50%;
            border: none; cursor: pointer;
            background: var(--card); color: var(--text-3);
            box-shadow: var(--shadow);
            display: flex; align-items: center; justify-content: center;
        }
        .admin-trigger:hover { color: var(--text); }

        @media (max-width: 380px) {
            .card { padding: 18px; }
            .title { font-size: 24px; }
            .stats { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <!-- GLOBAL ERROR MESSAGE -->
    <div id="globalError" class="hidden"></div>

    <!-- MAIN CONTAINER -->
    <main class="card">

        <!-- VIEW: REGISTRATION FORM (Default) -->
        <div id="view-register">
            <img src="https://i.ibb.co/mV3fXX2k/photo-2025-12-14-00-08-07.jpg" alt="Disco Collage" class="hero-img" id="headerImage">
            <p class="eyebrow">Шкільна вечірка · 80-ті</p>
            <h1 class="title">Дискотека</h1>
            <p class="subtitle">Зареєструйся, щоб отримати квиток.</p>

            <form id="registerForm">
                <div class="row field">
                    <div>
                        <label class="label" for="regFirstName">Ім'я</label>
                        <input type="text" id="regFirstName" required class="input" placeholder="Вася" autocomplete="given-name">
                    </div>
                    <div>
                        <label class="label" for="regLastName">Прізвище</label>
                        <input type="text" id="regLastName" required class="input" placeholder="Пупкін" autocomplete="family-name">
                    </div>
                </div>

                <div class="row field">
                    <div>
                        <label class="label" for="regGrade">Клас</label>
                        <div class="select-wrap">
                            <select id="regGrade" required class="input">
                                <option value="" disabled selected>Обрати</option>
                                <option value="9">9 Клас</option>
                                <option value="10-А">10-А Клас</option>
                                <option value="10-Б">10-Б Клас</option>
                                <option value="10-В">10-В Клас</option>
                                <option value="10-Г">10-Г Клас</option>
                                <option value="10-Д">10-Д Клас</option>
                                <option value="10-Е">10-Е Клас</option>
                                <option value="10-Є">10-Є Клас</option>
                                <option value="11-А">11-А Клас</option>
                                <option value="11-Б">11-Б Клас</option>
                            </select>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                    </div>
                    <div>
                        <label class="label" for="regPhone">Телефон</label>
                        <input type="tel" id="regPhone" required class="input" placeholder="+380..." value="+380" autocomplete="tel">
                    </div>
                </div>

                <div class="captcha">
                    <div class="g-recaptcha" data-sitekey="6LeKzCosAAAAALIF_wFbmz3PKZPQZ2nRfAHUxUn4"></div>
                </div>

                <div id="regError" class="alert hidden"></div>

                <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="margin-top:16px">
                    Отримати квиток
                </button>
            </form>
        </div>

        <!-- VIEW: TICKET SUCCESS -->
        <div id="view-ticket" class="hidden" style="text-align:center">
            <span class="badge-ok"><i class="fas fa-check-circle"></i> Ти у списку</span>
            <h3 class="ticket-name" id="ticketName"></h3>
            <p class="ticket-grade" id="ticketGrade"></p>

            <div class="qr-box"><div id="qrcode"></div></div>
            <p class="ticket-id">ID: <span id="ticketId"></span></p>

            <div class="note">
                <i class="fas fa-camera"></i> Зроби скріншот — без нього не пустять.
            </div>
        </div>

        <!-- VIEW: ADMIN LOGIN -->
        <div id="view-admin-login" class="hidden">
            <h2 class="title" style="margin-bottom:6px">Вхід</h2>
            <p class="subtitle">Тільки для організаторів.</p>
            <form id="adminLoginForm">
                <div class="field">
                    <input type="text" id="adminUser" placeholder="Логін" class="input" autocomplete="username">
                </div>
                <div class="field">
                    <input type="password" id="adminPass" placeholder="Пароль" class="input" autocomplete="current-password">
                </div>
                <div id="loginError" class="alert hidden">Невірний логін або пароль</div>
                <button type="submit" class="btn btn-primary" style="margin-top:12px">Увійти</button>
                <button type="button" onclick="showView('view-register')" class="btn-link">Назад</button>
            </form>
        </div>

        <!-- VIEW: ADMIN DASHBOARD -->
        <div id="view-admin-dash" class="hidden">
            <div class="admin-head">
                <h2>Фейс-контроль</h2>
                <button onclick="logoutAdmin()" class="btn-link" style="width:auto;padding:4px">Вийти</button>
            </div>

            <!-- Tabs -->
            <div class="segmented">
                <button onclick="switchAdminTab('scan')" id="tab-scan" class="active">Сканер</button>
                <button onclick="switchAdminTab('list')" id="tab-list">Список</button>
            </div>

            <!-- Tab Content: Scanner -->
            <div id="admin-scan-content">
                <div id="reader"></div>
                <div id="scanResult" class="scan-result hidden"></div>
                <div style="text-align:center;margin-top:16px">
                    <button id="startScanBtn" class="btn-pill primary"><i class="fas fa-camera"></i> Сканувати</button>
                    <button id="stopScanBtn" class="btn-pill danger hidden">Зупинити</button>
                </div>
            </div>

            <!-- Tab Content: List & Stats -->
            <div id="admin-list-content" class="hidden">
                <div id="gradeStats" class="stats">
                    <!-- Per-class counters generated by JS -->
                </div>

                <div class="totals">
                    <span>Всього: <b id="totalReg">0</b></span>
                    <span>Прийшли: <b id="totalEntered" class="green">0</b></span>
                </div>

                <table>
                    <tbody id="studentsTableBody">
                        <!-- Rows generated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Hidden Admin Trigger -->
    <button onclick="showView('view-admin-login')" class="admin-trigger" aria-label="Адмін">
        <i class="fas fa-lock"></i>
    </button>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, onSnapshot, query, orderBy, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBk7pCfHC-_odVmIz43IdJYlCdkLu4C_BA",
            authDomain: "verification-2c9a4.firebaseapp.com",
            projectId: "verification-2c9a4",
            storageBucket: "verification-2c9a4.firebasestorage.app",
            messagingSenderId: "1000464962274",
            appId: "1:1000464962274:web:0c4d60cf9aa87a1f1c04bb",
            measurementId: "G-QK2KF6TZFR"
        };

        // INIT FIREBASE
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Ensure auth language is Ukrainian for SMS templates/Captcha
        auth.languageCode = 'uk';

        // UI HELPERS
        const showGlobalError = (msg) => {
            const el = document.getElementById('globalError');
            el.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${msg}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        };

        // CLASSES (must match <select id="regGrade"> options)
        const GRADES = [...document.querySelectorAll('#regGrade option[value]:not([value=""])')].map(o => o.value);

        // GLOBAL STATE
        let html5QrCode;
        let unsubscribeListeners = null;

        // AUTHENTICATION STRATEGY
        signInAnonymously(auth).catch((err) => console.log("Anon auth failed:", err));

        // =======================
        // VIEW NAVIGATION
        // =======================
        window.showView = (viewId) => {
            ['view-register', 'view-ticket', 'view-admin-login', 'view-admin-dash'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');

            // Cleanup when leaving admin dash
            if (viewId !== 'view-admin-dash') {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.stop().catch(err => console.error(err));
                    document.getElementById('stopScanBtn').classList.add('hidden');
                    document.getElementById('startScanBtn').classList.remove('hidden');
                }
                if (unsubscribeListeners) {
                    unsubscribeListeners();
                    unsubscribeListeners = null;
                }
            }
        }

        // Init setup on load
        showView('view-register');

        // =======================
        // STUDENT REGISTRATION
        // =======================
        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('regSubmitBtn');
        const errorDiv = document.getElementById('regError');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');

            // 1. CAPTCHA CHECK
            const captchaResponse = grecaptcha.getResponse();
            if (!captchaResponse) {
                errorDiv.innerText = "Підтвердіть, що ви не робот.";
                errorDiv.classList.remove('hidden');
                return;
            }

            // 2. FORM DATA
            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const grade = document.getElementById('regGrade').value;
            const phone = document.getElementById('regPhone').value.trim();

            if (!firstName || !lastName || !grade || !phone) {
                errorDiv.innerText = "Заповніть усі поля.";
                errorDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader"></div>';

            try {
                // 3. Save Data to Firestore
                if (!auth.currentUser) await signInAnonymously(auth);

                const docRef = await addDoc(collection(db, "guests"), {
                    firstName,
                    lastName,
                    grade,
                    phone,
                    uid: auth.currentUser ? auth.currentUser.uid : 'anon',
                    status: 'registered',
                    createdAt: serverTimestamp()
                });

                // 4. Generate QR
                const guestId = docRef.id;
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById('qrcode'), {
                    text: guestId,
                    width: 160,
                    height: 160,
                    colorDark : "#1d1d1f",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                // 5. Show Ticket
                document.getElementById('ticketName').textContent = `${firstName} ${lastName}`;
                document.getElementById('ticketGrade').textContent = `${grade} клас`;
                document.getElementById('ticketId').textContent = guestId;

                showView('view-ticket');
                localStorage.setItem('saved_ticket', guestId);

                registerForm.reset();
                grecaptcha.reset();

            } catch (error) {
                console.error("Registration Error:", error);
                submitBtn.disabled = false;
                submitBtn.textContent = "Отримати квиток";

                let msg = "Помилка реєстрації.";
                if (error.code === 'permission-denied') msg = "Помилка доступу до бази.";

                errorDiv.innerHTML = msg;
                errorDiv.classList.remove('hidden');
            }
        });

        // =======================
        // ADMIN LOGIC
        // =======================
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;
            const err = document.getElementById('loginError');

            // HARDCODED ADMIN CREDENTIALS
            if (u === 'admin' && p === 'Гімназія') {
                document.getElementById('adminUser').value = '';
                document.getElementById('adminPass').value = '';
                err.classList.add('hidden');
                initAdminDashboard();
                showView('view-admin-dash');
            } else {
                err.classList.remove('hidden');
            }
        });

        window.logoutAdmin = () => {
            showView('view-register');
        }

        window.switchAdminTab = (tab) => {
            const isScan = tab === 'scan';
            document.getElementById('tab-scan').classList.toggle('active', isScan);
            document.getElementById('tab-list').classList.toggle('active', !isScan);
            document.getElementById('admin-scan-content').classList.toggle('hidden', !isScan);
            document.getElementById('admin-list-content').classList.toggle('hidden', isScan);
        }

        // =======================
        // SCANNER LOGIC
        // =======================
        let isProcessingScan = false;

        document.getElementById('startScanBtn').addEventListener('click', () => {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = { fps: 10, qrbox: { width: 220, height: 220 } };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => {
                document.getElementById('startScanBtn').classList.add('hidden');
                document.getElementById('stopScanBtn').classList.remove('hidden');
                document.getElementById('scanResult').classList.add('hidden');
            })
            .catch(err => {
                alert("Помилка камери: " + err);
            });
        });

        document.getElementById('stopScanBtn').addEventListener('click', () => {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('stopScanBtn').classList.add('hidden');
                    document.getElementById('startScanBtn').classList.remove('hidden');
                }).catch(err => console.log(err));
            }
        });

        const onScanSuccess = async (decodedText, decodedResult) => {
            if (isProcessingScan) return;
            isProcessingScan = true;

            const resDiv = document.getElementById('scanResult');
            resDiv.className = "scan-result";
            resDiv.innerHTML = '<div class="loader"></div>';

            try {
                const docRef = doc(db, "guests", decodedText);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();

                    if (data.status === 'registered') {
                        // SUCCESS
                        await updateDoc(docRef, {
                            status: 'entered',
                            enteredAt: serverTimestamp()
                        });
                        resDiv.className = "scan-result scan-ok";
                        resDiv.innerHTML = `
                            <div class="icon"><i class="fas fa-check-circle"></i></div>
                            <div class="name">${data.firstName} ${data.lastName}</div>
                            <div class="sub">Вхід дозволено · ${data.grade} клас</div>
                        `;
                        playBeep(true);
                    } else if (data.status === 'entered') {
                        // ALREADY USED
                        resDiv.className = "scan-result scan-warn";
                        resDiv.innerHTML = `
                            <div class="icon"><i class="fas fa-exclamation-circle"></i></div>
                            <div class="name">${data.firstName} ${data.lastName}</div>
                            <div class="sub">Вже зайшов</div>
                        `;
                        playBeep(false);
                    }
                } else {
                    // NOT FOUND
                    resDiv.className = "scan-result scan-bad";
                    resDiv.innerHTML = `
                        <div class="icon"><i class="fas fa-times-circle"></i></div>
                        <div class="name" style="color:inherit">Квиток недійсний</div>
                    `;
                    playBeep(false);
                }
            } catch (err) {
                console.error(err);
                resDiv.className = "scan-result scan-bad";
                resDiv.innerText = "Помилка";
            }

            setTimeout(() => {
                isProcessingScan = false;
            }, 3000);
        };

        function playBeep(success) {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            osc.type = success ? 'sine' : 'triangle';
            osc.frequency.value = success ? 880 : 220;
            osc.connect(context.destination);
            osc.start();
            osc.stop(context.currentTime + 0.15);
            if(success) {
                setTimeout(() => {
                    const osc2 = context.createOscillator();
                    osc2.type = 'sine';
                    osc2.frequency.value = 1320;
                    osc2.connect(context.destination);
                    osc2.start();
                    osc2.stop(context.currentTime + 0.1);
                }, 100);
            }
        }

        // =======================
        // DASHBOARD DATA LISTENER
        // =======================
        function initAdminDashboard() {
            if (unsubscribeListeners) return;

            const q = query(collection(db, "guests"), orderBy("createdAt", "desc"));

            unsubscribeListeners = onSnapshot(q, (snapshot) => {
                const tableBody = document.getElementById('studentsTableBody');
                const counts = Object.fromEntries(GRADES.map(g => [g, 0]));
                let entered = 0;
                let html = '';

                snapshot.docs.forEach(doc => {
                    const d = doc.data();

                    if (d.grade in counts) counts[d.grade]++;
                    if (d.status === 'entered') entered++;

                    const statusBadge = d.status === 'entered'
                        ? '<span class="pill in">Є</span>'
                        : '<span class="pill out">Нема</span>';

                    html += `
                        <tr>
                            <td>
                                <div class="t-name">${d.firstName} ${d.lastName}</div>
                                <div class="t-phone">${d.phone}</div>
                            </td>
                            <td class="t-grade">${d.grade}</td>
                            <td style="text-align:right">${statusBadge}</td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = html;
                document.getElementById('gradeStats').innerHTML = GRADES.map(g => `
                    <div class="stat">
                        <div class="k">${g}</div>
                        <div class="v">${counts[g]}</div>
                    </div>
                `).join('');
                document.getElementById('totalReg').innerText = snapshot.size;
                document.getElementById('totalEntered').innerText = entered;
            }, (error) => {
                 console.error("Dashboard Error:", error);
            });
        }

    </script>
</body>
</html>
