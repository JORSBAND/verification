<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Весільна Дискотека 80-х</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <!-- Animate.css for professional text entrances -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Montserrat:wght@400;700;900&display=swap');

        /* Base Styles */
        body {
            background-color: #fcece4; 
            color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            background-image: radial-gradient(#eacab5 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        h1, h2, .retro-font { font-family: 'Ruslan Display', cursive; }

        .wedding-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #1a1a1a;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.8);
            border-radius: 0;
        }

        .input-retro {
            background-color: #fff;
            border: 2px solid #1a1a1a;
            color: #1a1a1a;
            font-weight: bold;
        }
        .input-retro:focus { outline: none; border-color: #d946ef; box-shadow: 0 0 0 2px #d946ef; }

        .btn-retro {
            background-color: #d946ef;
            border: 2px solid #1a1a1a;
            color: white;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #1a1a1a;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-retro:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #1a1a1a; }

        /* --- PROFESSIONAL DISCO ANIMATION STYLES --- */
        #discoOverlay {
            background: radial-gradient(circle at center, #2e0228 0%, #000000 100%);
            perspective: 1000px;
        }

        /* Spotlight Effect */
        .spotlight {
            position: absolute;
            top: -50%;
            left: 50%;
            width: 200px;
            height: 200%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4) 0%, transparent 80%);
            transform-origin: top center;
            animation: swing 3s infinite ease-in-out alternate;
            pointer-events: none;
            z-index: 1;
        }
        .spotlight:nth-child(2) { animation-delay: -1.5s; left: 30%; background: linear-gradient(to bottom, rgba(255,0,255,0.3) 0%, transparent 80%); }
        .spotlight:nth-child(3) { animation-delay: -0.5s; left: 70%; background: linear-gradient(to bottom, rgba(0,255,255,0.3) 0%, transparent 80%); }

        @keyframes swing {
            from { transform: rotate(-25deg); }
            to { transform: rotate(25deg); }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f0f;
            animation: fall linear forwards;
            z-index: 5;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        /* Dynamic Text Stages */
        .stage-text {
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 50%;
            transform: translateY(-50%);
            display: none; /* Hidden by default */
            z-index: 50; /* Higher than confetti (5) */
        }

        /* Text container for better readability */
        .text-backdrop {
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(255, 0, 255, 0.3);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
            margin: 0 20px;
            max-width: 90%;
        }

        .neon-text-large {
            font-size: 2.5rem;
            line-height: 1.1;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #ff00de,
                0 0 30px #ff00de,
                0 0 40px #ff00de;
        }

        .sub-neon {
            font-family: 'Ruslan Display', cursive;
            color: #0ff;
            font-size: 1.5rem;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 0.5rem;
        }

        /* Disco Ball Spin */
        .disco-ball-img {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            animation: spinBall 4s linear infinite;
        }
        @keyframes spinBall { 100% { transform: rotate(360deg); } }

        /* Pulse BG */
        .pulse-bg {
            animation: bgPulse 0.46s infinite alternate; /* Matches typical beat */
        }
        @keyframes bgPulse {
            from { background: radial-gradient(circle at center, #4a044e 0%, #000 100%); }
            to { background: radial-gradient(circle at center, #2e0228 0%, #000 100%); }
        }

        /* Scanner Fix */
        #reader { width: 100%; min-height: 250px; overflow: hidden !important; background: #000; position: relative; border: 3px solid #1a1a1a;}
        #reader video { object-fit: cover; width: 100% !important; height: 100% !important; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #d946ef; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { rotate(0deg); } 100% { rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- AUDIO ELEMENT (Hidden) -->
    <!-- New Audio Source (More reliable, direct MP3) -->
    <audio id="discoAudio" preload="auto">
        <source src="https://codeskulptor-demos.commondatastorage.googleapis.com/GalaxyInvaders/theme_01.mp3" type="audio/mpeg">
    </audio>

    <!-- PROFESSIONAL ANIMATION OVERLAY -->
    <div id="discoOverlay" class="fixed inset-0 z-[100] hidden overflow-hidden">
        
        <!-- Spotlights -->
        <div class="spotlight"></div>
        <div class="spotlight"></div>
        <div class="spotlight"></div>
        
        <!-- Container for Confetti -->
        <div id="confettiContainer" class="absolute inset-0 pointer-events-none"></div>

        <!-- STAGE 1: Intro -->
        <div id="stage1" class="stage-text">

                <div class="text-5xl sm:text-6xl font-black text-yellow-300 transform rotate-[-5deg] animate__animated animate__pulse animate__infinite mt-2 drop-shadow-[4px_4px_0_rgba(0,0,0,1)]">КРУТО!</div>
            </div>
        </div>

        <!-- STAGE 3: Main Event -->
        <div id="stage3" class="stage-text">
            <div class="text-backdrop animate__animated animate__fadeInDown text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2452/2452243.png" class="disco-ball-img filter drop-shadow-[0_0_15px_rgba(255,255,255,0.8)]" alt="Disco Ball">
                
                <div class="sub-neon">ЛАСКАВО ПРОСИМО</div>
                
                <h1 class="neon-text-large animate__animated animate__zoomInDown mb-4">
                    ВЕСІЛЬНА<br>ДИСКОТЕКА
                </h1>
                
                <div class="inline-block bg-yellow-400 text-black font-black text-xl sm:text-2xl px-6 py-2 transform skew-x-[-10deg] shadow-[4px_4px_0_rgba(0,0,0,1)] animate__animated animate__rubberBand animate__delay-1s">
                    30 ГРУДНЯ
                </div>
            </div>
        </div>

    </div>

    <!-- GLOBAL ERROR MESSAGE -->
    <div id="globalError" class="fixed top-0 left-0 w-full bg-red-600 text-white p-3 text-center hidden z-50 shadow-lg font-bold border-b-4 border-black text-sm"></div>

    <!-- MAIN CARD -->
    <div class="w-full max-w-md wedding-card p-4 sm:p-6 relative z-10">
        
        <!-- HEADER -->
        <div class="text-center mb-4">
            <div class="mb-3 border-2 border-black p-1 bg-white shadow-sm mx-auto max-w-full">
                <img src="https://i.ibb.co/mV3fXX2k/photo-2025-12-14-00-08-07.jpg" alt="Disco Collage" class="w-full h-auto max-h-[200px] object-cover object-center grayscale-0" id="headerImage">

            <div class="flex justify-center items-center space-x-2 text-xs sm:text-sm font-bold bg-yellow-300 inline-block px-2 border border-black transform -skew-x-12 mt-1">

        <!-- REGISTRATION FORM -->
        <div id="view-register">
            <form id="registerForm" class="space-y-3">

                    <div class="grid grid-cols-2 gap-2">

                    <div class="grid grid-cols-2 gap-2">
                         <div>

                            <div class="relative">
                                <select id="regGrade" required class="w-full p-2 text-sm input-retro appearance-none cursor-pointer">

                                    <option value="9">9 Клас</option>

                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-black">

                        <div>

                    </div>

                    <div class="flex justify-center my-2 border-2 border-black p-1 bg-gray-50 transform scale-90 origin-center">
                        <div class="g-recaptcha" data-sitekey="6LeKzCosAAAAALIF_wFbmz3PKZPQZ2nRfAHUxUn4"></div>

                </div>

                <div id="regError" class="text-red-600 text-xs text-center hidden p-1 bg-red-100 border border-red-600 font-bold"></div>
                
                <button type="submit" id="regSubmitBtn" class="w-full py-3 btn-retro font-black text-base tracking-widest mt-2">

        </div>

        <!-- TICKET VIEW -->
        <div id="view-ticket" class="hidden text-center space-y-4">

                <div class="bg-green-400 text-black px-4 py-1 border-2 border-black transform rotate-2 inline-block mb-3 font-bold shadow-[3px_3px_0px_rgba(0,0,0,1)] text-sm">
                    <i class="fas fa-check"></i> ТИ У СПИСКУ!
                </div>
                
                <h3 class="retro-font text-xl text-black mb-1" id="ticketName"></h3>
                <p class="text-purple-600 font-black uppercase text-xs tracking-widest bg-purple-100 inline-block px-2" id="ticketGrade"></p>
            </div>
            
            <div class="relative">
                <div class="flex justify-center bg-white p-2 mx-auto w-fit border-2 border-black shadow-[4px_4px_0px_rgba(0,0,0,0.2)]">
                    <div id="qrcode"></div>
                </div>
                <p class="text-gray-500 text-[10px] mt-2 font-mono">ID: <span id="ticketId" class="font-bold text-black"></span></p>
            </div>

            <div class="text-[10px] font-bold text-red-500 uppercase bg-red-50 p-1 border border-red-200">
                Зроби скріншот! Без нього не пустять!
            </div>
        </div>

        <!-- ADMIN LOGIN VIEW -->
        <div id="view-admin-login" class="hidden">
            <h2 class="text-xl retro-font text-center mb-4 text-black">Вхід для своїх</h2>
            <form id="adminLoginForm" class="space-y-3">
                <input type="text" id="adminUser" placeholder="Логін" class="w-full p-2 input-retro">
                <input type="password" id="adminPass" placeholder="Пароль" class="w-full p-2 input-retro">
                <div id="loginError" class="text-white bg-red-600 p-1 text-xs hidden text-center border border-black font-bold">Невірні дані</div>
                <button type="submit" class="w-full py-2 bg-black text-white border-2 border-black hover:bg-gray-800 transition font-bold uppercase text-sm">Увійти</button>
                <button type="button" onclick="showView('view-register')" class="w-full py-1 text-gray-500 hover:text-black text-xs font-bold underline">Назад</button>
            </form>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div id="view-admin-dash" class="hidden">
            <div class="flex justify-between items-center mb-4 border-b-4 border-black pb-2">
                <h2 class="retro-font text-lg text-black">Фейс-контроль</h2>
                <button onclick="logoutAdmin()" class="text-[10px] text-red-600 hover:text-red-800 font-black uppercase tracking-wider border border-red-600 px-2 py-1 hover:bg-red-50"> Вихід <i class="fas fa-sign-out-alt ml-1"></i></button>
            </div>
            <div class="flex space-x-0 mb-4 border-2 border-black">
                <button onclick="switchAdminTab('scan')" id="tab-scan" class="flex-1 py-2 bg-yellow-300 text-black text-xs font-bold border-r-2 border-black hover:bg-yellow-400">СКАНЕР</button>
                <button onclick="switchAdminTab('list')" id="tab-list" class="flex-1 py-2 bg-white text-gray-500 text-xs font-bold hover:bg-gray-100">СПИСОК</button>
            </div>
            <div id="admin-scan-content">
                <div id="reader"></div>
                <div id="scanResult" class="mt-4 p-3 text-center hidden font-bold text-sm border-2 border-black shadow-[3px_3px_0px_#000]"></div>
                <div class="mt-4 text-center">
                    <button id="startScanBtn" class="bg-green-500 text-black border-2 border-black px-6 py-2 font-black uppercase shadow-[3px_3px_0px_#000] text-sm"><i class="fas fa-camera mr-2"></i> Сканувати</button>
                    <button id="stopScanBtn" class="bg-red-500 text-white border-2 border-black px-6 py-2 font-black uppercase shadow-[3px_3px_0px_#000] hidden text-sm">Зупинити</button>
                </div>
            </div>
            <div id="admin-list-content" class="hidden h-80 overflow-y-auto pr-1">
                <div class="grid grid-cols-3 gap-2 mb-4 text-center">
                    <div class="bg-white p-1 border-2 border-black shadow-[2px_2px_0px_#000]">
                        <div class="text-[9px] text-gray-500 uppercase font-bold">9 Клас</div><div id="count9" class="text-lg text-pink-600 font-black">0</div>
                    </div>
                    <div class="bg-white p-1 border-2 border-black shadow-[2px_2px_0px_#000]">
                        <div class="text-[9px] text-gray-500 uppercase font-bold">10 Клас</div><div id="count10" class="text-lg text-purple-600 font-black">0</div>
                    </div>
                    <div class="bg-white p-1 border-2 border-black shadow-[2px_2px_0px_#000]">
                        <div class="text-[9px] text-gray-500 uppercase font-bold">11 Клас</div><div id="count11" class="text-lg text-blue-600 font-black">0</div>
                    </div>
                </div>
                <div class="flex justify-between text-[10px] font-bold mb-2 px-1 border-b-2 border-gray-200 pb-2">
                    <span>Всього: <span id="totalReg" class="text-black">0</span></span>
                    <span>Прийшли: <span id="totalEntered" class="text-green-600">0</span></span>
                </div>
                <table class="w-full text-xs text-left"><tbody id="studentsTableBody" class="divide-y divide-black"></tbody></table>
            </div>
        </div>
    </div>

    <!-- Hidden Admin Trigger -->
    <div class="fixed bottom-2 right-2">
        <button onclick="showView('view-admin-login')" class="text-black hover:text-pink-600 transition p-2 bg-yellow-300 border-2 border-black shadow-[2px_2px_0px_#000]"><i class="fas fa-user-secret text-lg"></i></button>
    </div>

    <!-- LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIG (Replace with your own if needed, but this one works for demo)
        const firebaseConfig = {
            apiKey: "AIzaSyBk7pCfHC-_odVmIz43IdJYlCdkLu4C_BA",
            authDomain: "verification-2c9a4.firebaseapp.com",
            projectId: "verification-2c9a4",
            storageBucket: "verification-2c9a4.firebasestorage.app",
            messagingSenderId: "1000464962274",
            appId: "1:1000464962274:web:0c4d60cf9aa87a1f1c04bb",
            measurementId: "G-QK2KF6TZFR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        auth.languageCode = 'uk';

        let html5QrCode;
        let unsubscribeListeners = null;
        signInAnonymously(auth).catch((err) => console.log("Anon auth failed:", err));

        window.showView = (viewId) => {
            ['view-register', 'view-ticket', 'view-admin-login', 'view-admin-dash'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            if (viewId !== 'view-admin-dash') {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.stop().catch(err => console.error(err));
                    document.getElementById('stopScanBtn').classList.add('hidden');
                    document.getElementById('startScanBtn').classList.remove('hidden');
                }
                if (unsubscribeListeners) { unsubscribeListeners(); unsubscribeListeners = null; }
            }
        }
        showView('view-register');

        // --- ANIMATION & AUDIO ---
        const audio = document.getElementById('discoAudio');
        audio.volume = 0.5;

        // Confetti Maker
        function fireConfetti() {
            const colors = ['#f0f', '#0ff', '#ff0', '#f00', '#fff'];
            const container = document.getElementById('confettiContainer');
            
            // Create 30 particles every call
            for(let i=0; i<30; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's'; // 2-4s fall
                container.appendChild(conf);
                
                // Cleanup
                setTimeout(() => conf.remove(), 4000);
            }
        }

        async function runProfessionalDiscoSequence(callback) {
            const overlay = document.getElementById('discoOverlay');
            const s1 = document.getElementById('stage1');
            const s2 = document.getElementById('stage2');
            const s3 = document.getElementById('stage3');
            
            // Reset styles
            [s1, s2, s3].forEach(el => el.style.display = 'none');
            
            // Force display block to enable flex/center styles immediately
            s1.style.display = 'flex';
            
            overlay.classList.remove('hidden');
            overlay.classList.add('pulse-bg');

            // 1. START AUDIO
            try {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Autoplay prevented:", e));
            } catch(e) { console.log("Audio play failed", e); }

            // 2. TIMELINE OF EVENTS (Total ~9 seconds)
            
            // 0s: Start
            fireConfetti();
            let confettiInterval = setInterval(fireConfetti, 400); // Continuous confetti

            // 0s: Stage 1 "Готуй вбрання" (already shown via display:flex above)
            
            // 2.5s: Hide S1, Show S2 "Це буде..."
            setTimeout(() => { 
                s1.style.display = 'none'; 
                s2.style.display = 'flex';
            }, 2500);

            // 4.5s: The Drop! Hide S2, Show S3 "WELCOME"
            setTimeout(() => {
                s2.style.display = 'none';
                s3.style.display = 'flex';
                // Intense confetti
                clearInterval(confettiInterval);
                confettiInterval = setInterval(fireConfetti, 100); 
            }, 4500);

            // 9.0s: Finish
            setTimeout(() => {
                clearInterval(confettiInterval);
                // Fade out audio
                let fade = setInterval(() => {
                    if(audio.volume > 0.1) audio.volume -= 0.1;
                    else { clearInterval(fade); audio.pause(); audio.volume = 0.5; }
                }, 200);

                overlay.classList.add('animate__animated', 'animate__fadeOut');
                
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('animate__animated', 'animate__fadeOut', 'pulse-bg');
                    if (callback) callback();
                }, 1000);
            }, 9000);
        }

        // --- REGISTRATION ---
        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('regSubmitBtn');
        const errorDiv = document.getElementById('regError');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            
            if (!grecaptcha.getResponse()) {
                errorDiv.innerText = "Підтвердіть, що ви не робот!";
                errorDiv.classList.remove('hidden');
                return;
            }

            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const grade = document.getElementById('regGrade').value;
            const phone = document.getElementById('regPhone').value.trim();

            if (!firstName || !lastName || !grade || !phone) {
                errorDiv.innerText = "Заповніть всі поля!";
                errorDiv.classList.remove('hidden');
                return;
            }

            // ATTEMPT TO UNLOCK AUDIO ON USER INTERACTION
            // Browsers allow audio.play() inside click handlers.
            // We call play() here and pause() to unlock it, then reset time.
            try {
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                }).catch(err => console.log("Audio unlock failed (will try again in sequence):", err));
            } catch (err) {}

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Вантажимо...';

            // RUN ANIMATION BEFORE SAVING
            await runProfessionalDiscoSequence(async () => {
                try {
                    if (!auth.currentUser) await signInAnonymously(auth);

                    const docRef = await addDoc(collection(db, "guests"), {
                        firstName, lastName, grade, phone,
                        uid: auth.currentUser ? auth.currentUser.uid : 'anon',
                        status: 'registered',
                        createdAt: serverTimestamp()
                    });

                    const guestId = docRef.id;
                    document.getElementById('qrcode').innerHTML = "";
                    new QRCode(document.getElementById('qrcode'), {
                        text: guestId, width: 140, height: 140,
                        colorDark : "#1a1a1a", colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    document.getElementById('ticketName').textContent = `${firstName} ${lastName}`;
                    document.getElementById('ticketGrade').textContent = `${grade} Клас`;
                    document.getElementById('ticketId').textContent = guestId;

                    showView('view-ticket');
                    localStorage.setItem('saved_ticket', guestId);
                    registerForm.reset();
                    grecaptcha.reset();
                    submitBtn.textContent = "ОТРИМАТИ КВИТОК!";
                    submitBtn.disabled = false;

                } catch (error) {
                    console.error(error);
                    submitBtn.disabled = false;
                    submitBtn.textContent = "ОТРИМАТИ КВИТОК!";
                    errorDiv.innerHTML = "Помилка реєстрації. Спробуйте ще раз.";
                    errorDiv.classList.remove('hidden');
                }
            });
        });

        // --- ADMIN & SCANNER LOGIC (Kept same as before) ---
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (document.getElementById('adminUser').value === 'admin' && document.getElementById('adminPass').value === 'disco2024') {
                initAdminDashboard();
                showView('view-admin-dash');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });
        window.logoutAdmin = () => showView('view-register');
        window.switchAdminTab = (tab) => {
            const s = document.getElementById('admin-scan-content');
            const l = document.getElementById('admin-list-content');
            const bs = document.getElementById('tab-scan');
            const bl = document.getElementById('tab-list');
            if(tab === 'scan') {
                s.classList.remove('hidden'); l.classList.add('hidden');
                bs.classList.replace('bg-white','bg-yellow-300'); bl.classList.replace('bg-yellow-300','bg-white');
            } else {
                l.classList.remove('hidden'); s.classList.add('hidden');
                bl.classList.replace('bg-white','bg-yellow-300'); bs.classList.replace('bg-yellow-300','bg-white');
            }
        };

        let isProcessingScan = false;
        document.getElementById('startScanBtn').addEventListener('click', () => {
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 220 } }, onScanSuccess)
            .then(() => {
                document.getElementById('startScanBtn').classList.add('hidden');
                document.getElementById('stopScanBtn').classList.remove('hidden');
                document.getElementById('scanResult').classList.add('hidden');
            });
        });
        document.getElementById('stopScanBtn').addEventListener('click', () => {
            if(html5QrCode) html5QrCode.stop().then(() => {
                document.getElementById('stopScanBtn').classList.add('hidden');
                document.getElementById('startScanBtn').classList.remove('hidden');
            });
        });

        const onScanSuccess = async (decodedText) => {
            if (isProcessingScan) return;
            isProcessingScan = true;
            const r = document.getElementById('scanResult');
            r.classList.remove('hidden','bg-green-200','bg-yellow-200','bg-red-200');
            r.innerHTML = '<div class="loader"></div>';
            
            try {
                const ref = doc(db, "guests", decodedText);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    const d = snap.data();
                    if (d.status === 'registered') {
                        await updateDoc(ref, { status: 'entered', enteredAt: serverTimestamp() });
                        r.className = "mt-4 p-3 text-center bg-green-200 border-2 border-black shadow-[3px_3px_0px_#000]";
                        r.innerHTML = `<div class="text-green-800 text-2xl"><i class="fas fa-thumbs-up"></i></div><div class="font-black uppercase">${d.firstName}</div><div class="text-[10px] font-bold">ВХІД ДОЗВОЛЕНО</div>`;
                    } else {
                        r.className = "mt-4 p-3 text-center bg-yellow-200 border-2 border-black shadow-[3px_3px_0px_#000]";
                        r.innerHTML = `<div class="text-yellow-800 text-2xl"><i class="fas fa-hand-paper"></i></div><div class="font-black uppercase">${d.firstName}</div><div class="text-[10px] font-bold">ВЖЕ ЗАЙШОВ!</div>`;
                    }
                } else {
                    r.className = "mt-4 p-3 text-center bg-red-200 border-2 border-black shadow-[3px_3px_0px_#000]";
                    r.innerHTML = `<div class="text-red-800 text-2xl"><i class="fas fa-ban"></i></div><div class="font-black text-xs">ФАЛЬШИВКА!</div>`;
                }
            } catch(e) { r.innerText = "Помилка"; }
            setTimeout(() => isProcessingScan = false, 3000);
        };

        function initAdminDashboard() {
            if (unsubscribeListeners) return;
            unsubscribeListeners = onSnapshot(query(collection(db, "guests"), orderBy("createdAt", "desc")), (snap) => {
                let c9=0, c10=0, c11=0, ent=0, html='';
                snap.docs.forEach(doc => {
                    const d = doc.data();
                    if(d.grade=='9')c9++; if(d.grade=='10')c10++; if(d.grade=='11')c11++; if(d.status=='entered')ent++;
                    html += `<tr class="hover:bg-yellow-50 border-b border-black"><td class="px-1 py-2 font-bold text-xs uppercase">${d.firstName} ${d.lastName}</td><td class="px-1 py-2 text-xs border-l border-black text-center">${d.grade}</td><td class="px-1 py-2 text-right border-l border-black">${d.status=='entered'?'<span class="bg-green-200 px-1 border border-black text-[9px]">Є</span>':'<span class="bg-gray-100 px-1 border border-gray-300 text-[9px]">Нема</span>'}</td></tr>`;
                });
                document.getElementById('studentsTableBody').innerHTML = html;
                document.getElementById('count9').innerText = c9; document.getElementById('count10').innerText = c10; document.getElementById('count11').innerText = c11;
                document.getElementById('totalReg').innerText = snap.size; document.getElementById('totalEntered').innerText = ent;
            });
        }
    </script>
</body>
</html>
