<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Весільна Дискотека 80-х</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Montserrat:wght@400;700&display=swap');

        /* Background matched to the peach color of your collage */
        body {
            background-color: #fcece4; 
            color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            background-image: radial-gradient(#eacab5 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        h1, h2, .retro-font {
            font-family: 'Ruslan Display', cursive; /* Retro style font */
        }

        .wedding-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #1a1a1a;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.8); /* Slightly smaller shadow for mobile */
            border-radius: 0;
        }

        .input-retro {
            background-color: #fff;
            border: 2px solid #1a1a1a;
            color: #1a1a1a;
            transition: all 0.2s ease;
            font-weight: bold;
        }
        .input-retro:focus {
            box-shadow: 4px 4px 0px #d4af37;
            outline: none;
            border-color: #1a1a1a;
        }

        .btn-retro {
            background-color: #d946ef; /* Bright pink */
            border: 2px solid #1a1a1a;
            color: white;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #1a1a1a;
            transition: all 0.1s;
        }
        .btn-retro:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #1a1a1a;
        }
        .btn-retro:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #1a1a1a;
        }

        /* Fixed Scanner Styles */
        #reader {
            width: 100%;
            min-height: 250px; /* Minimum height to prevent collapse */
            border: 3px solid #1a1a1a;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.2);
            overflow: hidden !important; /* Crucial: cuts off overflowing video */
            background: #000;
            position: relative;
        }
        
        #reader video {
            object-fit: cover;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d946ef;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- DISCO ANIMATIONS --- */
        @keyframes disco-flash {
            0% { background-color: #000; }
            20% { background-color: #1e1b4b; } /* Indigo */
            40% { background-color: #4c0519; } /* Rose */
            60% { background-color: #064e3b; } /* Emerald */
            80% { background-color: #4a044e; } /* Fuchsia */
            100% { background-color: #000; }
        }
        
        @keyframes disco-spin {
            0% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
            50% { transform: rotate(180deg) scale(1.1); filter: hue-rotate(90deg); }
            100% { transform: rotate(360deg) scale(1); filter: hue-rotate(0deg); }
        }

        @keyframes text-zoom {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .disco-bg-active {
            animation: disco-flash 0.8s infinite;
        }

        .disco-ball-icon {
            font-size: 8rem;
            background: -webkit-linear-gradient(#eee, #333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
            animation: disco-spin 2s linear infinite;
        }
        
        .date-pop {
            animation: text-zoom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- DISCO OVERLAY -->
    <div id="discoOverlay" class="fixed inset-0 z-[100] hidden flex flex-col items-center justify-center overflow-hidden">
        <!-- Background beams (optional visual flair) -->
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-30"></div>
        
        <div class="relative z-10 text-center">
            <i class="fas fa-compact-disc disco-ball-icon mb-8 block mx-auto text-white"></i>
            
            <h1 class="text-6xl sm:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-yellow-300 via-pink-500 to-cyan-400 drop-shadow-[4px_4px_0_rgba(0,0,0,1)] date-pop leading-none">
                30<br>ГРУДНЯ
            </h1>
            <p class="text-white font-mono mt-4 text-xl font-bold animate-pulse">DISCO TIME!</p>
        </div>
    </div>

    <!-- GLOBAL ERROR MESSAGE -->
    <div id="globalError" class="fixed top-0 left-0 w-full bg-red-600 text-white p-3 text-center hidden z-50 shadow-lg font-bold border-b-4 border-black text-sm">
        <!-- Error text will be injected here -->
    </div>

    <!-- MAIN CONTAINER -->
    <div class="w-full max-w-md wedding-card p-4 sm:p-6 relative z-10">
        
        <!-- HEADER WITH IMAGE PLACEHOLDER -->
        <div class="text-center mb-4">
            <!-- Зменшено відступи та встановлено горизонтальний формат -->
            <div class="mb-3 border-2 border-black p-1 bg-white shadow-sm mx-auto max-w-full">
                <!-- Використано max-h для обмеження висоти на мобільних -->
                <img src="https://i.ibb.co/mV3fXX2k/photo-2025-12-14-00-08-07.jpg" 
                     alt="Disco Collage" 
                     class="w-full h-auto max-h-[200px] object-cover object-center grayscale-0"
                     id="headerImage">
            </div>

            <h1 class="text-2xl sm:text-3xl font-bold text-black retro-font mb-1 tracking-wider uppercase leading-none">
                <span class="text-pink-600">Disco</span> Wedding
            </h1>
            <div class="flex justify-center items-center space-x-2 text-xs sm:text-sm font-bold bg-yellow-300 inline-block px-2 border border-black transform -skew-x-12 mt-1">
                <span>80s VIBES</span>
                <i class="fas fa-compact-disc animate-spin-slow"></i>
                <span>SCHOOL PARTY</span>
            </div>
        </div>

        <!-- VIEW: REGISTRATION FORM (Default) -->
        <div id="view-register">
            <form id="registerForm" class="space-y-3">
                <!-- Step 1: Personal Data -->
                <div id="step-data" class="space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-black text-black uppercase tracking-wider mb-1">Ім'я</label>
                            <input type="text" id="regFirstName" required class="w-full p-2 text-sm input-retro" placeholder="Вася">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-black uppercase tracking-wider mb-1">Прізвище</label>
                            <input type="text" id="regLastName" required class="w-full p-2 text-sm input-retro" placeholder="Пупкін">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                         <div>
                            <label class="block text-[10px] font-black text-black uppercase tracking-wider mb-1">Клас</label>
                            <div class="relative">
                                <select id="regGrade" required class="w-full p-2 text-sm input-retro appearance-none cursor-pointer">
                                    <option value="" disabled selected>Клас</option>
                                    <option value="9">9 Клас</option>
                                    <option value="10">10 Клас</option>
                                    <option value="11">11 Клас</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-black">
                                    <i class="fas fa-chevron-down text-xs"></i>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-black uppercase tracking-wider mb-1">Телефон</label>
                            <input type="tel" id="regPhone" required class="w-full p-2 text-sm input-retro" placeholder="+380..." value="+380">
                        </div>
                    </div>

                    <!-- ReCaptcha Container (Compact) -->
                    <div class="flex justify-center my-2 border-2 border-black p-1 bg-gray-50 transform scale-90 origin-center">
                        <div class="g-recaptcha" data-sitekey="6LeKzCosAAAAALIF_wFbmz3PKZPQZ2nRfAHUxUn4"></div>
                    </div>
                </div>

                <div id="regError" class="text-red-600 text-xs text-center hidden p-1 bg-red-100 border border-red-600 font-bold"></div>
                
                <button type="submit" id="regSubmitBtn" class="w-full py-3 btn-retro font-black text-base tracking-widest mt-2">
                    ОТРИМАТИ КВИТОК!
                </button>
            </form>
        </div>

        <!-- VIEW: TICKET SUCCESS -->
        <div id="view-ticket" class="hidden text-center space-y-4">
            <div class="border-b-4 border-dotted border-black pb-4">
                <div class="bg-green-400 text-black px-4 py-1 border-2 border-black transform rotate-2 inline-block mb-3 font-bold shadow-[3px_3px_0px_rgba(0,0,0,1)] text-sm">
                    <i class="fas fa-check"></i> ТИ У СПИСКУ!
                </div>
                
                <h3 class="retro-font text-xl text-black mb-1" id="ticketName"></h3>
                <p class="text-purple-600 font-black uppercase text-xs tracking-widest bg-purple-100 inline-block px-2" id="ticketGrade"></p>
            </div>
            
            <div class="relative">
                <div class="flex justify-center bg-white p-2 mx-auto w-fit border-2 border-black shadow-[4px_4px_0px_rgba(0,0,0,0.2)]">
                    <div id="qrcode"></div>
                </div>
                <p class="text-gray-500 text-[10px] mt-2 font-mono">ID: <span id="ticketId" class="font-bold text-black"></span></p>
            </div>

            <div class="text-[10px] font-bold text-red-500 uppercase bg-red-50 p-1 border border-red-200">
                Зроби скріншот! Без нього не пустять!
            </div>
        </div>

        <!-- VIEW: ADMIN LOGIN -->
        <div id="view-admin-login" class="hidden">
            <h2 class="text-xl retro-font text-center mb-4 text-black">Вхід для своїх</h2>
            <form id="adminLoginForm" class="space-y-3">
                <input type="text" id="adminUser" placeholder="Логін" class="w-full p-2 input-retro">
                <input type="password" id="adminPass" placeholder="Пароль" class="w-full p-2 input-retro">
                <div id="loginError" class="text-white bg-red-600 p-1 text-xs hidden text-center border border-black font-bold">Невірні дані</div>
                <button type="submit" class="w-full py-2 bg-black text-white border-2 border-black hover:bg-gray-800 transition font-bold uppercase text-sm">Увійти</button>
                <button type="button" onclick="showView('view-register')" class="w-full py-1 text-gray-500 hover:text-black text-xs font-bold underline">Назад</button>
            </form>
        </div>

        <!-- VIEW: ADMIN DASHBOARD -->
        <div id="view-admin-dash" class="hidden">
            <div class="flex justify-between items-center mb-4 border-b-4 border-black pb-2">
                <h2 class="retro-font text-lg text-black">Фейс-контроль</h2>
                <button onclick="logoutAdmin()" class="text-[10px] text-red-600 hover:text-red-800 font-black uppercase tracking-wider border border-red-600 px-2 py-1 hover:bg-red-50"> Вихід <i class="fas fa-sign-out-alt ml-1"></i></button>
            </div>

            <!-- Tabs -->
            <div class="flex space-x-0 mb-4 border-2 border-black">
                <button onclick="switchAdminTab('scan')" id="tab-scan" class="flex-1 py-2 bg-yellow-300 text-black text-xs font-bold border-r-2 border-black hover:bg-yellow-400">СКАНЕР</button>
                <button onclick="switchAdminTab('list')" id="tab-list" class="flex-1 py-2 bg-white text-gray-500 text-xs font-bold hover:bg-gray-100">СПИСОК</button>
            </div>

            <!-- Tab Content: Scanner -->
            <div id="admin-scan-content">
                <!-- Removed class h-64, relying on CSS min-height -->
                <div id="reader"></div>
                
                <div id="scanResult" class="mt-4 p-3 text-center hidden font-bold text-sm border-2 border-black shadow-[3px_3px_0px_#000]"></div>
                <div class="mt-4 text-center">
                    <button id="startScanBtn" class="bg-green-500 text-black border-2 border-black px-6 py-2 font-black uppercase shadow-[3px_3px_0px_#000] text-sm">
                        <i class="fas fa-camera mr-2"></i> Сканувати
                    </button>
                    <button id="stopScanBtn" class="bg-red-500 text-white border-2 border-black px-6 py-2 font-black uppercase shadow-[3px_3px_0px_#000] hidden text-sm">
                        Зупинити
                    </button>
                </div>
            </div>

            <!-- Tab Content: List & Stats -->
            <div id="admin-list-content" class="hidden h-80 overflow-y-auto pr-1">
                <!-- Stats -->
                <div class="grid grid-cols-3 gap-2 mb-4 text-center">
                    <div class="bg-white p-1 border-2 border-black shadow-[2px_2px_0px_#000]">
                        <div class="text-[9px] text-gray-500 uppercase font-bold">9 Клас</div>
                        <div id="count9" class="text-lg text-pink-600 font-black">0</div>
                    </div>
                    <div class="bg-white p-1 border-2 border-black shadow-[2px_2px_0px_#000]">
                        <div class="text-[9px] text-gray-500 uppercase font-bold">10 Клас</div>
                        <div id="count10" class="text-lg text-purple-600 font-black">0</div>
                    </div>
                    <div class="bg-white p-1 border-2 border-black shadow-[2px_2px_0px_#000]">
                        <div class="text-[9px] text-gray-500 uppercase font-bold">11 Клас</div>
                        <div id="count11" class="text-lg text-blue-600 font-black">0</div>
                    </div>
                </div>
                
                <div class="flex justify-between text-[10px] font-bold mb-2 px-1 border-b-2 border-gray-200 pb-2">
                    <span>Всього: <span id="totalReg" class="text-black">0</span></span>
                    <span>Прийшли: <span id="totalEntered" class="text-green-600">0</span></span>
                </div>

                <!-- Table -->
                <table class="w-full text-xs text-left">
                    <tbody id="studentsTableBody" class="divide-y divide-black">
                        <!-- Rows generated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Hidden Admin Trigger -->
    <div class="fixed bottom-2 right-2">
        <button onclick="showView('view-admin-login')" class="text-black hover:text-pink-600 transition p-2 bg-yellow-300 border-2 border-black shadow-[2px_2px_0px_#000]">
            <i class="fas fa-user-secret text-lg"></i>
        </button>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, onSnapshot, query, orderBy, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBk7pCfHC-_odVmIz43IdJYlCdkLu4C_BA",
            authDomain: "verification-2c9a4.firebaseapp.com",
            projectId: "verification-2c9a4",
            storageBucket: "verification-2c9a4.firebasestorage.app",
            messagingSenderId: "1000464962274",
            appId: "1:1000464962274:web:0c4d60cf9aa87a1f1c04bb",
            measurementId: "G-QK2KF6TZFR"
        };

        // INIT FIREBASE
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // Ensure auth language is Ukrainian for SMS templates/Captcha
        auth.languageCode = 'uk';

        // UI HELPERS
        const showGlobalError = (msg) => {
            const el = document.getElementById('globalError');
            el.innerHTML = `<i class="fas fa-exclamation-circle mr-2"></i> ${msg}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        };

        // GLOBAL STATE
        let html5QrCode;
        let unsubscribeListeners = null;

        // AUTHENTICATION STRATEGY
        signInAnonymously(auth).catch((err) => console.log("Anon auth failed:", err));

        // =======================
        // VIEW NAVIGATION
        // =======================
        window.showView = (viewId) => {
            ['view-register', 'view-ticket', 'view-admin-login', 'view-admin-dash'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');

            // Cleanup when leaving admin dash
            if (viewId !== 'view-admin-dash') {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.stop().catch(err => console.error(err));
                    document.getElementById('stopScanBtn').classList.add('hidden');
                    document.getElementById('startScanBtn').classList.remove('hidden');
                }
                if (unsubscribeListeners) {
                    unsubscribeListeners();
                    unsubscribeListeners = null;
                }
            }
        }
        
        // Init setup on load
        showView('view-register');

        // =======================
        // DISCO & AUDIO LOGIC
        // =======================
        let audioCtx;
        
        function playDiscoTune() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Simple retro funky beat generator
            const now = audioCtx.currentTime;
            
            // Bass line (Square wave)
            const bass = audioCtx.createOscillator();
            const bassGain = audioCtx.createGain();
            bass.type = 'square';
            bass.connect(bassGain);
            bassGain.connect(audioCtx.destination);
            
            // Melody (Sawtooth)
            const lead = audioCtx.createOscillator();
            const leadGain = audioCtx.createGain();
            lead.type = 'sawtooth';
            lead.connect(leadGain);
            leadGain.connect(audioCtx.destination);
            
            // Notes frequencies: C2, E2, G2, A2 | C5, E5
            const bassNotes = [65.41, 82.41, 98.00, 110.00]; 
            const leadNotes = [523.25, 659.25, 783.99, 1046.50];

            // Sequence loop for 3 seconds
            for (let i = 0; i < 8; i++) {
                let t = now + i * 0.25;
                
                // Bass
                bass.frequency.setValueAtTime(bassNotes[i % 4], t);
                bassGain.gain.setValueAtTime(0.3, t);
                bassGain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                
                // Lead (Offbeat)
                if (i % 2 !== 0) {
                   lead.frequency.setValueAtTime(leadNotes[i % 4], t);
                   leadGain.gain.setValueAtTime(0.1, t);
                   leadGain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                }
            }

            bass.start(now);
            bass.stop(now + 3); // 3 seconds total
            
            lead.start(now);
            lead.stop(now + 3);
        }

        async function runDiscoSequence(callback) {
            const overlay = document.getElementById('discoOverlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('disco-bg-active');
            
            // Start Music
            try {
                playDiscoTune();
            } catch(e) { console.log("Audio play failed", e); }
            
            // Wait 3 seconds
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('disco-bg-active');
                if (callback) callback();
            }, 3500); // 3.5 seconds
        }

        // =======================
        // STUDENT REGISTRATION
        // =======================
        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('regSubmitBtn');
        const errorDiv = document.getElementById('regError');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            
            // 1. CAPTCHA CHECK
            const captchaResponse = grecaptcha.getResponse();
            if (!captchaResponse) {
                errorDiv.innerText = "Підтвердіть, що ви не робот!";
                errorDiv.classList.remove('hidden');
                return;
            }

            // 2. FORM DATA
            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const grade = document.getElementById('regGrade').value;
            const phone = document.getElementById('regPhone').value.trim();

            if (!firstName || !lastName || !grade || !phone) {
                errorDiv.innerText = "Заповніть всі поля!";
                errorDiv.classList.remove('hidden');
                return;
            }

            // --- START DISCO SEQUENCE HERE ---
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-compact-disc fa-spin"></i> ЗАЧЕКАЙТЕ...';

            // Wait for sequence, THEN submit to Firebase
            await runDiscoSequence(async () => {
                submitBtn.innerHTML = '<div class="loader"></div>';
                
                try {
                    // 3. Save Data to Firestore
                    if (!auth.currentUser) await signInAnonymously(auth);

                    const docRef = await addDoc(collection(db, "guests"), {
                        firstName,
                        lastName,
                        grade,
                        phone,
                        uid: auth.currentUser ? auth.currentUser.uid : 'anon',
                        status: 'registered',
                        createdAt: serverTimestamp()
                    });

                    // 4. Generate QR
                    const guestId = docRef.id;
                    document.getElementById('qrcode').innerHTML = "";
                    new QRCode(document.getElementById('qrcode'), {
                        text: guestId,
                        width: 140, // Slightly smaller QR
                        height: 140,
                        colorDark : "#1a1a1a",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    // 5. Show Ticket
                    document.getElementById('ticketName').textContent = `${firstName} ${lastName}`;
                    document.getElementById('ticketGrade').textContent = `${grade} Клас`;
                    document.getElementById('ticketId').textContent = guestId;

                    showView('view-ticket');
                    localStorage.setItem('saved_ticket', guestId);
                    
                    registerForm.reset();
                    grecaptcha.reset();

                } catch (error) {
                    console.error("Registration Error:", error);
                    submitBtn.disabled = false;
                    submitBtn.textContent = "ОТРИМАТИ КВИТОК!";
                    
                    let msg = "Помилка реєстрації.";
                    if (error.code === 'permission-denied') msg = "Помилка доступу до бази.";
                    
                    errorDiv.innerHTML = msg;
                    errorDiv.classList.remove('hidden');
                }
            });
        });

        // =======================
        // ADMIN LOGIC
        // =======================
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;
            const err = document.getElementById('loginError');

            // HARDCODED ADMIN CREDENTIALS
            if (u === 'admin' && p === 'disco2024') {
                document.getElementById('adminUser').value = '';
                document.getElementById('adminPass').value = '';
                err.classList.add('hidden');
                initAdminDashboard();
                showView('view-admin-dash');
            } else {
                err.classList.remove('hidden');
            }
        });

        window.logoutAdmin = () => {
            showView('view-register');
        }

        window.switchAdminTab = (tab) => {
            const btnScan = document.getElementById('tab-scan');
            const btnList = document.getElementById('tab-list');
            const viewScan = document.getElementById('admin-scan-content');
            const viewList = document.getElementById('admin-list-content');

            if (tab === 'scan') {
                btnScan.classList.replace('bg-white', 'bg-yellow-300');
                btnScan.classList.replace('text-gray-500', 'text-black');
                
                btnList.classList.replace('bg-yellow-300', 'bg-white');
                btnList.classList.replace('text-black', 'text-gray-500');
                
                viewScan.classList.remove('hidden');
                viewList.classList.add('hidden');
            } else {
                btnList.classList.replace('bg-white', 'bg-yellow-300');
                btnList.classList.replace('text-gray-500', 'text-black');
                
                btnScan.classList.replace('bg-yellow-300', 'bg-white');
                btnScan.classList.replace('text-black', 'text-gray-500');

                viewList.classList.remove('hidden');
                viewScan.classList.add('hidden');
            }
        }

        // =======================
        // SCANNER LOGIC
        // =======================
        let isProcessingScan = false;

        document.getElementById('startScanBtn').addEventListener('click', () => {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            const config = { fps: 10, qrbox: { width: 220, height: 220 } };
            
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => {
                document.getElementById('startScanBtn').classList.add('hidden');
                document.getElementById('stopScanBtn').classList.remove('hidden');
                document.getElementById('scanResult').classList.add('hidden');
            })
            .catch(err => {
                alert("Помилка камери: " + err);
            });
        });

        document.getElementById('stopScanBtn').addEventListener('click', () => {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('stopScanBtn').classList.add('hidden');
                    document.getElementById('startScanBtn').classList.remove('hidden');
                }).catch(err => console.log(err));
            }
        });

        const onScanSuccess = async (decodedText, decodedResult) => {
            if (isProcessingScan) return;
            isProcessingScan = true;

            const resDiv = document.getElementById('scanResult');
            resDiv.classList.remove('hidden', 'bg-green-300', 'bg-red-300', 'bg-yellow-300', 'text-white');
            resDiv.innerHTML = '<div class="loader"></div>';
            resDiv.className = "mt-4 p-3 text-center font-bold text-sm bg-white border-2 border-black shadow-[3px_3px_0px_#000]";

            try {
                const docRef = doc(db, "guests", decodedText);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    if (data.status === 'registered') {
                        // SUCCESS
                        await updateDoc(docRef, {
                            status: 'entered',
                            enteredAt: serverTimestamp()
                        });
                        resDiv.className = "mt-4 p-3 text-center bg-green-200 border-2 border-black shadow-[3px_3px_0px_#000]";
                        resDiv.innerHTML = `
                            <div class="text-green-800 text-2xl mb-1"><i class="fas fa-thumbs-up"></i></div>
                            <div class="font-black uppercase text-black text-lg">${data.firstName} ${data.lastName}</div>
                            <div class="text-[10px] text-green-800 font-bold uppercase tracking-widest mt-1">ВХІД ДОЗВОЛЕНО (${data.grade} кл)</div>
                        `;
                        playBeep(true);
                    } else if (data.status === 'entered') {
                        // ALREADY USED
                        resDiv.className = "mt-4 p-3 text-center bg-yellow-200 border-2 border-black shadow-[3px_3px_0px_#000]";
                        resDiv.innerHTML = `
                            <div class="text-yellow-800 text-2xl mb-1"><i class="fas fa-hand-paper"></i></div>
                            <div class="font-black uppercase text-black text-lg">${data.firstName} ${data.lastName}</div>
                            <div class="text-[10px] text-yellow-800 font-bold uppercase tracking-widest mt-1">ВЖЕ ЗАЙШОВ!</div>
                        `;
                        playBeep(false);
                    }
                } else {
                    // NOT FOUND
                    resDiv.className = "mt-4 p-3 text-center bg-red-200 border-2 border-black shadow-[3px_3px_0px_#000]";
                    resDiv.innerHTML = `
                        <div class="text-red-800 text-2xl mb-1"><i class="fas fa-ban"></i></div>
                        <div class="font-black text-red-800 uppercase tracking-widest text-xs">ФАЛЬШИВКА!</div>
                    `;
                    playBeep(false);
                }
            } catch (err) {
                console.error(err);
                resDiv.innerText = "Помилка";
            }

            setTimeout(() => {
                isProcessingScan = false;
            }, 3000);
        };

        function playBeep(success) {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            osc.type = success ? 'square' : 'sawtooth'; // Retro sounds
            osc.frequency.value = success ? 880 : 150;
            osc.connect(context.destination);
            osc.start();
            osc.stop(context.currentTime + 0.15);
            if(success) {
                setTimeout(() => {
                    const osc2 = context.createOscillator();
                    osc2.type = 'square';
                    osc2.frequency.value = 1760;
                    osc2.connect(context.destination);
                    osc2.start();
                    osc2.stop(context.currentTime + 0.1);
                }, 100);
            }
        }

        // =======================
        // DASHBOARD DATA LISTENER
        // =======================
        function initAdminDashboard() {
            if (unsubscribeListeners) return;

            const q = query(collection(db, "guests"), orderBy("createdAt", "desc"));
            
            unsubscribeListeners = onSnapshot(q, (snapshot) => {
                const tableBody = document.getElementById('studentsTableBody');
                let c9 = 0, c10 = 0, c11 = 0;
                let entered = 0;
                let html = '';

                snapshot.docs.forEach(doc => {
                    const d = doc.data();
                    
                    if (d.grade == '9') c9++;
                    if (d.grade == '10') c10++;
                    if (d.grade == '11') c11++;
                    if (d.status === 'entered') entered++;

                    const statusBadge = d.status === 'entered' 
                        ? '<span class="px-2 py-1 bg-green-200 text-black border border-black rounded-none text-[9px] font-bold uppercase">Є</span>' 
                        : '<span class="px-2 py-1 bg-gray-100 text-gray-500 border border-gray-300 rounded-none text-[9px] font-bold uppercase">Нема</span>';

                    html += `
                        <tr class="hover:bg-yellow-50 transition border-b border-black">
                            <td class="px-1 py-2">
                                <div class="font-bold text-black uppercase text-xs">${d.firstName} ${d.lastName}</div>
                                <div class="text-[9px] text-gray-500 font-mono">${d.phone}</div>
                            </td>
                            <td class="px-1 py-2 text-xs font-bold text-black border-l border-black text-center">${d.grade}</td>
                            <td class="px-1 py-2 text-right border-l border-black">${statusBadge}</td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = html;
                document.getElementById('count9').innerText = c9;
                document.getElementById('count10').innerText = c10;
                document.getElementById('count11').innerText = c11;
                document.getElementById('totalReg').innerText = snapshot.size;
                document.getElementById('totalEntered').innerText = entered;
            }, (error) => {
                 console.error("Dashboard Error:", error);
            });
        }

    </script>
</body>
</html>
